[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/client"
  [build.environment]
    NETLIFY_USE_PNPM = "true"
    NODE_VERSION = "20"
    VITE_API_BASE_URL = "https://sype-ministry.onrender.com"
    VITE_API_URL = "https://sype-ministry.onrender.com"

[functions]
  external_node_modules = ["express"]
  node_bundler = "esbuild"

# API redirects
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

# SPA fallback - redirect all routes to index.html for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Admin panel route (protected)
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Caching for static assets (Vite puts these in /assets/)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Caching for images and media files
[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Ensure all other routes (like /, /admin, etc.) and HTML files are revalidated
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Don't cache service workers if added
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
