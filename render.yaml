services:
  - type: web
    name: sype-ministry-api
    env: node
    plan: starter
    buildCommand: NODE_ENV=development npm install && npm run build:server && npx prisma generate
    # MongoDB: apply schema via db push before starting
    startCommand: npx prisma db push && node dist/server/node-build.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: PRISMA_CLIENT_ENGINE_TYPE
        value: library
      - key: PORT
        fromService:
          name: sype-ministry-api
          type: web
          property: port
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

