services:
  - type: web
    name: sype-ministry-api
    env: node
    plan: starter
    buildCommand: NODE_ENV=development npm install && npm run build:server && npx prisma generate
    # Ensure database schema is applied before starting the server
    startCommand: npx prisma migrate deploy && node dist/server/node-build.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: PORT
        fromService:
          name: sype-ministry-api
          type: web
          property: port
      - key: DATABASE_URL
        fromDatabase:
          name: sype-ministry-db
          property: connectionString
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: sype-ministry-db
    plan: starter
    databaseName: sypeministry
    user: sypeministry
