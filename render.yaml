services:
  - type: web
    name: sype-ministry-api
    env: node
    plan: starter
    buildCommand: NODE_ENV=development npm install && npm run build:server
    startCommand: node dist/server/node-build.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: PORT
        fromService:
          name: sype-ministry-api
          type: web
          property: port
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Site
      - key: SITE_URL
        sync: false
      - key: SITE_NAME
        sync: false
      # Email — Brevo SMTP relay
      - key: SMTP_FROM
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SMTP_USER
        sync: false
      # Email — fallback SMTP (kept for reference, not used when Brevo is configured)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      # Notification email addresses
      - key: CONTACT_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      # Scheduler settings
      - key: YOUTUBE_NOTIFY_AFTER_HOURS
        sync: false
      - key: CONTENT_NOTIFY_AFTER_HOURS
        sync: false
      - key: ENABLE_REMINDERS
        sync: false
